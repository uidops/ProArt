[package]
name = "proart-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DDC/CI monitor control for ASUS ProArt displays: protocol, backends, feature registry"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display"] }

[dev-dependencies]
tempfile = "3"
